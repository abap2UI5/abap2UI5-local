name: build_rename

# Renames the handler class, the table and the ICF node of an installable
# branch (standard or 702) to a customer name and pushes the result to
# rename_<name> (from standard) or rename_<name>_702 - for a second local
# installation, or one in a customer namespace (ZMYUI5: z2ui5_cl_... becomes
# zmyui5_cl_...). At most 9 characters: the ICF node z2ui5_local has 11, an
# ICF node may have 15. check_rename.yaml says what is not covered (cloud, a
# registered namespace). The work is the shared .github/scripts/rename.mjs on
# a checkout of the branch, prepared by .github/scripts/rename_prepare.sh.
# Re-running with the same name updates the branch; without content changes
# nothing is pushed.

on:
  workflow_dispatch:
    inputs:
      namespace:
        description: "New name: a customer name such as ZMYUI5, at most 9 characters"
        required: true
        type: string
      branch:
        description: "The branch to rename"
        required: true
        type: choice
        options: [standard, '702']
        default: standard

permissions:
  contents: read

concurrency:
  group: build_rename-${{ inputs.namespace }}-${{ inputs.branch }}
  cancel-in-progress: false

jobs:
  build_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      NAMESPACE: ${{ inputs.namespace }}
      SOURCE: ${{ inputs.branch }}
    steps:
      - name: Derive branch name
        run: |
          ns=$(printf '%s' "$NAMESPACE" | tr '[:upper:]' '[:lower:]')
          if ! printf '%s' "$ns" | grep -Eq '^[a-z][a-z0-9_]{0,8}$'; then
            echo "::error::Invalid name '$NAMESPACE' (a customer name: letter + letters/digits/underscore, at most 9 characters, e.g. ZMYUI5)"
            exit 1
          fi
          suffix=""; [ "$SOURCE" = "702" ] && suffix="_702"
          echo "BRANCH=rename_${ns}${suffix}" >> "$GITHUB_ENV"
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: main
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.branch }}
          path: tree
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: main/.github/scripts/rename_prepare.sh tree
      - name: Rename to ${{ inputs.namespace }}
        working-directory: tree
        run: node .github/scripts/rename.mjs --name "$NAMESPACE" --out "$RUNNER_TEMP/out"
      - name: Push renamed branch
        working-directory: tree
        run: |
          b="$BRANCH"
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git fetch origin "$b" --depth 1 2>/dev/null || true
          parent=$(git rev-parse -q --verify "refs/remotes/origin/$b" || true)
          index="$RUNNER_TEMP/index-$b"
          rm -f "$index"
          (cd "$RUNNER_TEMP/out" && GIT_DIR="$GITHUB_WORKSPACE/tree/.git" GIT_WORK_TREE=. GIT_INDEX_FILE="$index" git add -A)
          tree=$(GIT_INDEX_FILE="$index" git write-tree)
          if [ -n "$parent" ] && [ "$(git rev-parse "$parent^{tree}")" = "$tree" ]; then
            echo "$b: no changes"
            exit 0
          fi
          commit=$(git commit-tree "$tree" ${parent:+-p "$parent"} -p "$(git rev-parse HEAD)" -m "build: $b from $SOURCE $(git rev-parse --short HEAD)")
          git push origin "$commit:refs/heads/$b"
          echo "$b: pushed $commit"
