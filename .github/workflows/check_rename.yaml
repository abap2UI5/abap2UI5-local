name: check_rename

# The namespace rename every repository of the abap2UI5 ecosystem has to
# support, checked on the branches that are installed: standard and 702 (a
# checkout of each, prepared by .github/scripts/rename_prepare.sh, renamed by
# the shared .github/scripts/rename.mjs with the longest name it allows - 9
# characters, the ICF node z2ui5_local). The folded framework is local
# classes of z2ui5_cl_abap2ui5_local and is not renamed - it never collides;
# what is renamed is the handler class, the table z2ui5_t_99 and the ICF node.
#
# Not cloud: its HTTP service (HTTP, SCO2, SIA6, SUSH) names the handler
# class, and abaplint renames none of those objects (abap2UI5 backlog items
# abaplint-rename-cloud-service-objects, abaplint-rename-authorization-
# objects). A registered namespace (/CA2UI5/) renames the ICF node to a name
# with slashes, which abaplint writes into a broken URL
# (abaplint-rename-sicf-namespace) - customer names only, until then.

on:
  workflow_run:
    workflows: [generate_standard, generate_702]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check_rename-${{ github.event.workflow_run.name || github.ref }}
  cancel-in-progress: true

jobs:
  check_rename:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        branch: [standard, '702']
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: main
          path: main
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ matrix.branch }}
          path: tree
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '22'
      - run: main/.github/scripts/rename_prepare.sh tree
      - working-directory: tree
        run: node .github/scripts/rename.mjs
